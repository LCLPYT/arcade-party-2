def modes = [
        "default"
]

// Optional development selection: build/run only a subset of minigames and modes to cut compile time.
// Resolution per key: -P gradle property, then from the dev.local.properties file if it exists.
// See README for usage.

def devProps = new Properties()

def devPropsFile = file("dev.local.properties")

if (devPropsFile.exists()) {
    devPropsFile.withInputStream { devProps.load(it) }
}

def resolveSelection = { String key ->
    def raw = providers.gradleProperty(key).getOrNull() ?: devProps.getProperty(key)

    if (raw == null) {
        return null
    }

    return raw.split(",").collect { it.trim() }.findAll { !it.isEmpty() }
}

def applyFilter = { String kind, List<String> available, List<String> selection ->
    if (selection == null) {
        return available
    }

    def unknown = selection.findAll { !available.contains(it) }

    if (!unknown.isEmpty()) {
        throw new GradleException("Unknown ${kind}(s) in dev selection: ${unknown.join(", ")}. " +
                "Available: ${available.join(", ")}")
    }

    return available.findAll { selection.contains(it) }
}

def gameSelection = resolveSelection("ap2.games")
def modeSelection = resolveSelection("ap2.modes")

minigames = applyFilter("minigame", minigames, gameSelection)
modes = applyFilter("mode", modes, modeSelection)

if (gameSelection != null || modeSelection != null) {
    println "Dev filter is active: games=${minigames}, modes=${modes}"
}

minigames.forEach {
    include(it)
    project(":$it").projectDir = file("src/minigames/$it")
}

modes.forEach {
    include(it)
    project(":$it").projectDir = file("src/modes/$it")
}
