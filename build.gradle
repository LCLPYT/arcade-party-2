/*********************************************************************************************************************\
 * Tasks
 \*********************************************************************************************************************/
tasks.withType(JavaCompile).configureEach {
    it.options.release.set(javaVersion)
}

java {
    withSourcesJar()

    sourceCompatibility = JavaVersion.toVersion(javaVersion)
    targetCompatibility = JavaVersion.toVersion(javaVersion)
}

kotlin {
    jvmToolchain(javaVersion)
}

// resource expansion
def configureResources(ProcessResources task) {
    def tokens = [
            "version": project.version.toString(),
            "fantasy_version": libs.versions.fantasy.get(),
            "loader_version": libs.versions.fabric.loader.get(),
            "minecraft_compat": project.minecraft_compat,
            "java_version": libs.versions.java.get()
    ]

    task.inputs.properties(tokens)

    task.filesMatching("fabric.mod.json") {
        expand(tokens)
    }

    task.filesMatching("*.mixins.json") {
        filter(ReplaceTokens, beginToken: '${', endToken: '}', tokens: tokens)
    }
}

configureResources(processResources)

extraSourceSets.each { name ->
    def task = tasks.named("process${name.capitalize()}Resources", ProcessResources).get()
    configureResources(task)
}

def licenseJarTasks = [jar, sourcesJar]

// add jar and remapJar tasks for extra source Sets
Jar prevJarTask = null

for (name in extraSourceSets) {
    // add extra jar task
    def jar = tasks.register("${name}Jar", Jar.class) {
        from(sourceSets.named(name).get().output)
        archiveClassifier.set(name)

        description "Builds the standalone ${name} api jar."
        group 'build'
    }.get()

    if (prevJarTask != null) {
        jar.mustRunAfter(prevJarTask)
    }

    prevJarTask = jar

    tasks.assemble.dependsOn(jar)

    licenseJarTasks.add(jar)
}

// rename LICENSE files
licenseJarTasks.each {
    it.from("LICENSE") {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// add extra source set remapped artifacts to main jar output
configurations {
    nestedJars {
        transitive = false
    }
}

dependencies {
    extraSourceSets.each { name ->
        nestedJars(files(tasks.named("${name}Jar", Jar)))
    }
}

loom.nestJars(tasks.named("jar"), configurations.nestedJars)

/*********************************************************************************************************************\
 * Publishing
 \*********************************************************************************************************************/
def env = System.getenv()

tasks.register("github", GithubDeploymentTask) {
    dependsOn tasks.jar

    config {
        token = env.get("GITHUB_TOKEN")
        repository = env.get("GITHUB_REPOSITORY")
    }

    release {
        title = "[${libs.versions.minecraft.get()}] $project.name $project.version"
        tag = project.version
    }

    assets.add(tasks.jar.archiveFile.get())
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = project.base.archivesName.get()

            from components.java

            artifact libJar

            pom {
                name = "Arcade Party 2"
                description = "Reworked ArcadeParty as Fabric mini-game."
            }
        }
    }

    buildUtils.setupPublishRepository(repositories, props)
}