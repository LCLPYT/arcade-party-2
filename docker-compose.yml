services:
  server:
    build:
      context: .
      dockerfile: docker/Dockerfile
    image: arcade-party-2
    ports:
      - "25565:25565"
      - "24454:24454/udp"  # voice chat (optional)
    environment:
      EULA: "${EULA:-false}"  # needs to be specified by the user
      MAX_MEMORY: 6G
    volumes:
      - data:/data

volumes:
  data: