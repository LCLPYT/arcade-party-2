services:
  mc:
    image: itzg/minecraft-server:java21-alpine
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"  # voice chat
    env_file:
      - path: .env
        required: false
    environment:
      EULA: "TRUE"
      TZ: "Europe/Berlin"
      TYPE: 'FABRIC'
      VERSION: '1.21.11'
      MOTD: '                   \u00A7b\u00A7lLCLPNetwork\u00A7r\n                  \u00A76ArcadeParty 2'
      GUI: false
      MAX_MEMORY: 6G
      PACKWIZ_URL: "file:///packwiz/pack.toml"