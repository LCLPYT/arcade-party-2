name: Docker build

on: workflow_dispatch

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize repository name
        id: repo_name
        run: |
          echo "repo=${REPO,,}" >> $GITHUB_OUTPUT
        env:
          REPO: '${{ github.repository }}'

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          file: docker/Dockerfile
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repo }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo_name.outputs.repo }}:buildcache,mode=max
          tags: |
            ghcr.io/${{ steps.repo_name.outputs.repo }}:${{ github.sha }}
